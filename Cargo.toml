[package]
name = "vr-test-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "MCP server that drives SteamVR through ALVR with a virtual headset, for automated VR testing"

[dependencies]
alvr_client_core = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_common = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_packets = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_session = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_events = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_server_io = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_filesystem = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_audio = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
alvr_system_info = { git = "https://github.com/alvr-org/ALVR", rev = "ebec107b7e5f81677fb9c631d239daf2110bf573" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
libc = "0.2"
tungstenite = "0.30"
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
libloading = "0.8"
openh264 = "0.9"
png = "0.18"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
glob = "0.3"
pipewire = { version = "0.9", features = ["v0_3_49"] } # same as alvr_audio, whose lock entry it shares

[dev-dependencies]
# xr_probe example only
openxr = "0.22"
ash = { version = "0.38", default-features = false, features = ["loaded"] }

[build-dependencies]
bindgen = "0.72"
